name: CI

on:
  push:
    branches: [master]
  pull_request:

# The Prisma datasource reads env("DATABASE_URL"); `prisma generate` needs it
# defined even though it never connects. A throwaway local path is enough — CI
# only lints, typechecks, and runs unit tests, none of which open the database.
env:
  DATABASE_URL: "file:./prisma/ci.db"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Prisma client is generated code that isn't committed, so typecheck
      # and tests would fail to resolve @prisma/client without this.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
